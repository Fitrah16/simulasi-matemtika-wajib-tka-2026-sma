{ id:"Q047", topic:"Fungsi Kuadrat", level:"C4", type:"pg",

function getPackageQuestions(pkg){
  const s = idNum(pkg.startId), e = idNum(pkg.endId);
  return QUESTIONS.filter(q => { const n = idNum(q.id); return n >= s && n <= e; });
}

// satu Google Spreadsheet, dibuat otomatis oleh skrip saat skor pertama masuk.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbylRZvwUsEN43oF92b8AsQqUQOkqHtSVDnCTj5OXdUsPds438d-Gm5ZVELczkb_YrhzpQ/exec";

function appsScriptConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf("PASTE_") !== 0;
}

async function submitScore(pkgId, nama, sekolah, skor){
  if(!appsScriptConfigured()) return { ok:false, reason:"not_configured" };
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      // Content-Type text/plain dipakai secara sengaja supaya browser TIDAK
      // mengirim preflight OPTIONS (Apps Script Web App tidak menangani preflight CORS).
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "submit", pkg: pkgId, nama, sekolah, skor })
    });
    const data = await res.json();
    return { ok: !!data.ok, reason: data.error };
  }catch(e){ return { ok:false, reason:"network_error" }; }
}

async function fetchLeaderboard(pkgId){
  if(!appsScriptConfigured()) return { ok:false, reason:"not_configured", data:[] };
  try{
    const res = await fetch(APPS_SCRIPT_URL + "?action=list&pkg=" + encodeURIComponent(pkgId));
    if(!res.ok) return { ok:false, reason:"http_" + res.status, data:[] };
    const data = await res.json();
    if(!data.ok) return { ok:false, reason: data.error || "error", data:[] };
    const rows = (data.data || []).slice().sort((a,b) => (b.skor - a.skor));
    return { ok:true, data: rows.slice(0, 50) };
  }catch(e){ return { ok:false, reason:"network_error", data:[] }; }
}

// ---------- 10. EXAM ENGINE ----------
function startExam(pkg){
  const qs = getPackageQuestions(pkg);
  const existing = loadProgress(pkg.id);
  state.activeQuestions = qs;
  state.currentIndex = 0;
  state.answers = (existing && existing.status === "berlangsung" && existing.answers) ? existing.answers : {};
  state.ragu = (existing && existing.status === "berlangsung" && existing.ragu) ? existing.ragu : {};
  const totalSeconds = qs.length * pkg.minutesPerQuestion * 60;
  state.timerSeconds = (existing && existing.status === "berlangsung" && typeof existing.timerSeconds === "number") ? existing.timerSeconds : totalSeconds;
  saveProgress(pkg.id, { status:"berlangsung", answers: state.answers, ragu: state.ragu, timerSeconds: state.timerSeconds });
  state.view = "exam";
  render();
  startTimer();
}

function startTimer(){
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.timerSeconds--;
    updateTimerDisplay();
    if(state.timerSeconds % 10 === 0) persistExamProgress();
    if(state.timerSeconds <= 0){
      clearInterval(state.timerInterval);
      finishExam();
    }
  }, 1000);
}

function persistExamProgress(){
  saveProgress(state.activePackage.id, { status:"berlangsung", answers: state.answers, ragu: state.ragu, timerSeconds: state.timerSeconds });
}

function updateTimerDisplay(){
  const t = document.getElementById("examTimer");
  if(!t) return;
  const m = Math.floor(state.timerSeconds / 60).toString().padStart(2,"0");
  const s = Math.max(0, state.timerSeconds % 60).toString().padStart(2,"0");
  t.textContent = m + ":" + s;
  if(state.timerSeconds <= 300) t.classList.add("text-red-300");
}

function renderAnswerArea(q){

        <span class="opt-text text-sm"><b>${o.key}.</b> ${o.text}</span>
      </label>`).join("");
    box.querySelectorAll("input[type=radio]").forEach(inp => {
      inp.addEventListener("change", () => { state.answers[q.id] = inp.value; persistExamProgress(); renderExam(); });
    });
  } else if(q.type === "pgk"){
    const selected = state.answers[q.id] || [];
    box.innerHTML = `<div class="text-xs text-gray-400 mb-2">Pilih semua jawaban yang benar (bisa lebih dari satu)</div>` +
      q.options.map(o => `
      <label class="option-row flex items-start gap-3 border border-gray-200 rounded-lg px-3 py-2.5 mb-2 cursor-pointer ${selected.includes(o.key) ? 'selected':''}">
        <input type="checkbox" value="${o.key}" ${selected.includes(o.key) ? "checked":""}>
        <span class="opt-text text-sm">${o.text}</span>
      </label>`).join("");
    box.querySelectorAll("input[type=checkbox]").forEach(inp => {
      inp.addEventListener("change", () => {
        let cur = state.answers[q.id] || [];
        if(inp.checked) cur = [...new Set([...cur, inp.value])];
        else cur = cur.filter(v => v !== inp.value);
        state.answers[q.id] = cur;
        persistExamProgress();
        renderExam();
      });
    });
  } else if(q.type === "tabel"){
    const saved = state.answers[q.id] || {};
    box.innerHTML = `<table class="pernyataan w-full text-sm"><thead><tr class="bg-gray-50"><th class="text-left">Pernyataan</th><th>Benar</th><th>Salah</th></tr></thead><tbody>` +
      q.statements.map((s,i) => `
      <tr>
        <td>${s}</td>
        <td class="text-center"><input type="radio" name="stm${i}" value="Benar" ${saved[i]==="Benar"?"checked":""}></td>
        <td class="text-center"><input type="radio" name="stm${i}" value="Salah" ${saved[i]==="Salah"?"checked":""}></td>
      </tr>`).join("") + `</tbody></table>`;
    q.statements.forEach((s,i) => {
      box.querySelectorAll(`input[name=stm${i}]`).forEach(inp => {
        inp.addEventListener("change", () => {
          const cur = state.answers[q.id] || {};
          cur[i] = inp.value;
          state.answers[q.id] = cur;
          persistExamProgress();
        });
      });
    });
  } else if(q.type === "isian"){
    box.innerHTML = `<input id="isianInput" type="text" inputmode="decimal" placeholder="Masukkan jawaban Anda"
      class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2" style="--tw-ring-color:var(--navy-3);"
      value="${state.answers[q.id] || ""}">
      <p class="text-xs text-gray-400 mt-2">Isikan jawaban berupa angka. Gunakan titik (.) untuk desimal jika perlu.</p>`;
    const inp = document.getElementById("isianInput");
    inp.addEventListener("input", () => { state.answers[q.id] = inp.value; persistExamProgress(); });
  }
}

  }).join("");

  document.getElementById("closeGrid").addEventListener("click", () => modal.innerHTML = "");

function isAnswered(q){
  const a = state.answers[q.id];
  if(a === undefined || a === null) return false;
  if(q.type === "pgk") return Array.isArray(a) && a.length > 0;
  if(q.type === "tabel") return typeof a === "object" && Object.keys(a).length === q.statements.length;
  if(q.type === "isian") return String(a).trim() !== "";
  return true;
}

// ---------- 12. PENILAIAN & HASIL ----------
function scoreExam(){
  let correct = 0;
  const detail = state.activeQuestions.map(q => {
    const a = state.answers[q.id];
    let isCorrect = false;
    if(q.type === "pg"){ isCorrect = a === q.answer; }
    else if(q.type === "pgk"){
      const given = Array.isArray(a) ? [...a].sort() : [];
      const correctArr = [...q.answer].sort();
      isCorrect = given.length === correctArr.length && given.every((v,i) => v === correctArr[i]);
    } else if(q.type === "tabel"){
      if(a && typeof a === "object"){
        isCorrect = q.statements.every((s,i) => a[i] === q.answer[i]);
      }
    } else if(q.type === "isian"){
      if(a !== undefined && a !== null && String(a).trim() !== ""){
        const given = parseFloat(String(a).replace(",", "."));
        const correctVal = parseFloat(q.answer);
        const tol = q.tolerance || 0;
        isCorrect = !isNaN(given) && Math.abs(given - correctVal) <= tol;
      }
    }
    if(isCorrect) correct++;
    return { q, given: a, isCorrect };
  });
  const skor = Math.round((correct / state.activeQuestions.length) * 1000) / 10;
  return { correct, total: state.activeQuestions.length, skor, detail };
}

function finishExam(){
  clearInterval(state.timerInterval);
  const result = scoreExam();
  state.lastResult = result;
  saveProgress(state.activePackage.id, { status:"selesai", answers: state.answers, ragu: state.ragu, skor: result.skor, selesaiPada: Date.now() });
  submitScore(state.activePackage.id, state.student.nama, state.student.sekolah, result.skor);
  state.view = "result";
  render();
}

// ---------- 13. VIEW: HASIL ----------
function renderResult(){
  const r = state.lastResult;
  const rows = r.detail.map((d,i) => `
    <div class="border-b py-3">
      <div class="flex items-start justify-between gap-3">
        <div class="text-sm font-medium text-gray-700">Soal ${i+1}. ${stripHtml(d.q.question).slice(0,90)}${stripHtml(d.q.question).length>90 ? "…":""}</div>
        <span class="text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap ${d.isCorrect ? '' : 'bg-red-50 text-red-500'}" style="${d.isCorrect ? 'background:var(--green-bg);color:var(--green);' : ''}">${d.isCorrect ? 'Benar' : 'Kurang Tepat'}</span>
      </div>
      <div class="text-xs text-gray-500 mt-2 leading-relaxed"><b>Pembahasan:</b> ${d.q.explanation}</div>
    </div>`).join("");

  app.innerHTML = `
  <div class="min-h-screen" style="background:#eef2f7;">
    <header class="text-white py-6 px-4 sm:px-8 text-center" style="background:var(--navy);">
      <p class="text-blue-200 text-sm">${state.activePackage.name} &mdash; Hasil Ujian</p>
      <div class="text-4xl font-bold mt-1">${r.skor}</div>
      <p class="text-sm mt-1">${r.correct} dari ${r.total} soal terjawab benar</p>
    </header>
    <main class="max-w-3xl mx-auto p-4 sm:p-8">
      <div class="flex flex-wrap gap-3 mb-6">
        <button id="btnPilihLain" class="flex-1 btn-navy rounded-lg py-2.5 font-semibold text-sm min-w-[160px]">Pilih Paket Lain</button>
        <button id="btnUlangi" class="flex-1 border border-gray-300 bg-white rounded-lg py-2.5 font-semibold text-sm min-w-[160px]">Kerjakan Ulang</button>
        <button id="btnLb2" class="flex-1 border border-gray-300 bg-white rounded-lg py-2.5 font-semibold text-sm min-w-[160px]">Papan Peringkat</button>
      </div>
      <div class="bg-white rounded-xl shadow p-5">
        <h3 class="font-bold mb-2" style="color:var(--navy);">Pembahasan</h3>
        ${rows}
      </div>
    </main>
  </div>
  <div id="leaderboardModal"></div>`;

  document.getElementById("btnPilihLain").addEventListener("click", () => { state.view = "packages"; render(); });
  document.getElementById("btnUlangi").addEventListener("click", () => { state.answers={}; state.ragu={}; startExam(state.activePackage); });
  document.getElementById("btnLb2").addEventListener("click", () => openLeaderboard(state.activePackage.id));
}

function stripHtml(html){ const d = document.createElement("div"); d.innerHTML = html; return d.textContent || ""; }

// ---------- 14. LEADERBOARD MODAL ----------
async function openLeaderboard(preselectPkgId){
  const modal = document.getElementById("leaderboardModal");
  const options = PACKAGES.map(p => `<option value="${p.id}" ${p.id===preselectPkgId?"selected":""}>${p.name}</option>`).join("");
  modal.innerHTML = `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" id="lbBackdrop">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-5 fade-in">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold" style="color:var(--navy);">&#127942; Papan Peringkat</h3>
        <button id="closeLb" class="text-gray-400 text-xl leading-none">&times;</button>
      </div>
      <div class="flex gap-2 mb-3">
        <select id="lbPackageSelect" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm">${options}</select>
        <button id="lbRefresh" title="Muat ulang papan peringkat" class="shrink-0 border border-gray-300 rounded-lg px-3 py-2 text-sm hover:bg-gray-50">&#8635; Refresh</button>
      </div>
      <div id="lbBody" class="text-sm text-gray-500">Memuat...</div>
    </div>
  </div>`;
  document.getElementById("closeLb").addEventListener("click", () => modal.innerHTML = "");
  document.getElementById("lbBackdrop").addEventListener("click", (e) => { if(e.target.id==="lbBackdrop") modal.innerHTML=""; });
  const sel = document.getElementById("lbPackageSelect");
  sel.addEventListener("change", () => loadLbFor(sel.value));
  document.getElementById("lbRefresh").addEventListener("click", () => loadLbFor(sel.value));
  loadLbFor(preselectPkgId || PACKAGES[0].id);

  async function loadLbFor(pkgId){
    const body = document.getElementById("lbBody");
    body.innerHTML = "Memuat...";
    const res = await fetchLeaderboard(pkgId);
    if(!res.ok){
      body.innerHTML = res.reason === "not_configured"
        ? `<p class="text-amber-600">Leaderboard belum aktif. Tempel URL Web App Apps Script Anda pada variabel <code>APPS_SCRIPT_URL</code> di kode untuk mengaktifkan papan peringkat global (lihat instruksi setup Google Sheets).</p>`
        : `<p class="text-red-500">Gagal memuat papan peringkat (${escapeHtml(res.reason||"")}). Coba tekan Refresh.</p>`;
      return;
    }
    if(res.data.length === 0){ body.innerHTML = `<p>Belum ada peserta yang menyelesaikan paket ini.</p>`; return; }
    body.innerHTML = `<ol class="space-y-1 max-h-72 overflow-y-auto">` + res.data.map((row,i) => `
      <li class="flex justify-between border-b py-1.5">
        <span>${i+1}. ${escapeHtml(row.nama)} <span class="text-gray-400 text-xs">(${escapeHtml(row.sekolah||"")})</span></span>
        <b>${row.skor}</b>
      </li>`).join("") + `</ol>`;
  }
}
function escapeHtml(s){ const d=document.createElement("div"); d.textContent = s||""; return d.innerHTML; }

// ---------- 15. INIT ----------
(function init(){
  const s = loadStudent();
  if(s){ state.student = s; state.view = "packages"; }
  render();
})();
</script>
</body>
</html>
